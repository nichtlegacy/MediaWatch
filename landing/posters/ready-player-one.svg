<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Original artwork for the MediaWatch demo, not the film's key art:
       a synthwave sun over a neon grid, with a pixel egg for the hunt. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07061a"/><stop offset=".6" stop-color="#2a0b4a"/><stop offset="1" stop-color="#5c0f5e"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd23f"/><stop offset=".5" stop-color="#ff5fa2"/><stop offset="1" stop-color="#b3179b"/></linearGradient>
    <clipPath id="half"><rect x="0" y="0" width="200" height="196"/></clipPath>
  </defs>
  <rect width="200" height="300" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7"><circle cx="30" cy="30" r=".9"/><circle cx="160" cy="48" r="1"/><circle cx="120" cy="18" r=".7"/><circle cx="55" cy="70" r=".7"/><circle cx="178" cy="96" r=".8"/></g>
  <g clip-path="url(#half)">
    <circle cx="100" cy="190" r="62" fill="url(#sun)"/>
    <g fill="#2a0b4a"><rect x="30" y="172" width="140" height="3"/><rect x="30" y="181" width="140" height="4"/><rect x="30" y="190" width="140" height="5"/></g>
  </g>
  <rect y="196" width="200" height="104" fill="#12042b"/>
  <g stroke="#28e0ff" stroke-width="1.1" opacity=".85">
    <line x1="0" y1="196" x2="200" y2="196"/><line x1="0" y1="203" x2="200" y2="203"/><line x1="0" y1="214" x2="200" y2="214"/>
    <line x1="0" y1="230" x2="200" y2="230"/><line x1="0" y1="254" x2="200" y2="254"/><line x1="0" y1="288" x2="200" y2="288"/>
    <line x1="100" y1="196" x2="100" y2="300"/><line x1="86" y1="196" x2="44" y2="300"/><line x1="114" y1="196" x2="156" y2="300"/>
    <line x1="72" y1="196" x2="-12" y2="300"/><line x1="128" y1="196" x2="212" y2="300"/><line x1="58" y1="196" x2="-68" y2="300"/><line x1="142" y1="196" x2="268" y2="300"/>
  </g>
  <!-- The egg, in 8x10 pixels -->
  <g fill="#e8fbff" transform="translate(88 228)">
    <rect x="9" y="0" width="6" height="3"/><rect x="6" y="3" width="12" height="3"/><rect x="3" y="6" width="18" height="12"/><rect x="6" y="18" width="12" height="3"/>
    <rect x="9" y="8" width="3" height="3" fill="#28e0ff"/><rect x="14" y="12" width="3" height="3" fill="#ff5fa2"/>
  </g>
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="none" stroke-width="1.6">
    <text x="100" y="48" font-size="34" stroke="#28e0ff" textLength="120" lengthAdjust="spacingAndGlyphs">READY</text>
    <text x="100" y="83" font-size="34" stroke="#ff5fa2" textLength="150" lengthAdjust="spacingAndGlyphs">PLAYER</text>
    <text x="100" y="118" font-size="34" stroke="#ffd23f" textLength="90" lengthAdjust="spacingAndGlyphs">ONE</text>
  </g>
</svg>
