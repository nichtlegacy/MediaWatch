name: Publish container

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - dev
  release:
    types:
      - published
  # Releases cut by release-please use GITHUB_TOKEN, and GitHub does not start
  # other workflows from events that token creates - so `release` above never
  # fires for them. release-please.yml calls this workflow directly instead.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' && github.event_name == 'workflow_run' }}

jobs:
  test_release_ref:
    name: Release Python checks
    if: github.server_url == 'https://github.com' && (inputs.tag != '' || github.event_name != 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt

    - name: Check lint and formatting
      run: |
        ruff check .
        ruff format --check .

    - name: Run tests
      run: python -m pytest -q

  build_from_ci:
    name: Publish tested branch
    if: github.server_url == 'https://github.com' && inputs.tag == '' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # A SHA-only checkout has no branch ref for metadata-action to inspect.
    # Attach the verified commit locally without fetching a newer branch tip.
    - name: Name the checked branch commit
      env:
        SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: git switch -c "$SOURCE_BRANCH"

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Docker Metadata action
      id: docker_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        context: git
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha
          type=raw,value=dev,enable=${{ github.event.workflow_run.head_branch == 'dev' }}
          type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: |
          mediawatch-ci:check
          ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check container startup and file permissions
      run: bash scripts/check_container.sh mediawatch-ci:check

    - name: Publish checked image
      env:
        IMAGE_TAGS: ${{ steps.docker_meta.outputs.tags }}
      run: |
        while IFS= read -r tag; do
          docker push "$tag"
        done <<< "$IMAGE_TAGS"

  build_release:
    name: Publish release
    if: github.server_url == 'https://github.com' && (inputs.tag != '' || github.event_name != 'workflow_run')
    needs:
      - test_release_ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Docker Metadata action
      id: docker_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        context: git
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha
          type=semver,pattern={{version}},enable=${{ inputs.tag == '' }}
          type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref == 'refs/heads/dev' }}
          type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref == 'refs/heads/main' }}
        flavor: |
          latest=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (inputs.tag != '' && !contains(inputs.tag, '-')) }}

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: |
          mediawatch-ci:check
          ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check container startup and file permissions
      run: bash scripts/check_container.sh mediawatch-ci:check

    - name: Publish checked image
      env:
        IMAGE_TAGS: ${{ steps.docker_meta.outputs.tags }}
      run: |
        while IFS= read -r tag; do
          docker push "$tag"
        done <<< "$IMAGE_TAGS"
