name: CI

# Shared by GitHub and Forgejo. Keep the GitHub repository's default token
# permissions read-only; Forgejo does not support the permissions key.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Validate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'python-3.12' }}
    timeout-minutes: 30
    env:
      PIP_ROOT_USER_ACTION: ignore
      IMAGE_LOCAL: mediawatch-ci:${{ github.run_id }}
    steps:
      # actions/checkout is a JavaScript action and the runner image ships no
      # Node, so it has to be installed before the first `uses:` step - the
      # failure is an opaque "executable file `node` not found in $PATH".
      - name: Prepare Forgejo runner
        if: github.server_url != 'https://github.com'
        run: |
          apt-get update
          apt-get install -y ca-certificates curl docker.io git gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
            | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
          echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" \
            > /etc/apt/sources.list.d/nodesource.list
          apt-get update
          apt-get install -y nodejs

      # Resolves from GitHub or the Forgejo DEFAULT_ACTIONS_URL mirror.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python on GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Check website
        run: bash scripts/build_pages.sh
        env:
          PYTHON: python

      - name: Set up Docker Buildx on GitHub
        if: github.server_url == 'https://github.com'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image on GitHub
        if: github.server_url == 'https://github.com'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_LOCAL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the image on Forgejo
        if: github.server_url != 'https://github.com'
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/nichtlegacy/MediaWatch" \
            -t "$IMAGE_LOCAL" \
            .

      - name: Check container startup and file permissions
        run: bash scripts/check_container.sh "$IMAGE_LOCAL"

      - name: Prepare image metadata
        if: github.server_url != 'https://github.com' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          # Docker refuses an image name with an uppercase letter, and this
          # repository is "nichtlegacy/MediaWatch". The sibling repos are all
          # lowercase, so they never hit this.
          REPO_LOWER=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # Comes from the repository variable REGISTRY_HOST, not from the
          # workflow file: this file is published on GitHub as well, and a
          # private hostname does not belong in it. It cannot be derived from
          # GITHUB_SERVER_URL either - the runner sees the instance under its
          # internal address, which is not the name the registry is pulled by.
          if [ -z "$HOST" ]; then
            echo "Set the repository variable REGISTRY_HOST to the registry hostname" >&2
            exit 1
          fi
          {
            echo "REGISTRY_HOST=$HOST"
            echo "IMAGE_NAME=$HOST/$REPO_LOWER"
            echo "IMAGE_TAG_PROD=prod"
            echo "IMAGE_TAG_SHA=sha-$SHORT_SHA"
            echo "REGISTRY_CONFIG=$(mktemp -d)"
          } >> "$GITHUB_ENV"

      - name: Log in to the Forgejo registry
        if: github.server_url != 'https://github.com' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.repository_owner }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "Set the repository secret REGISTRY_TOKEN to a token with package write access" >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" \
            | docker --config "$REGISTRY_CONFIG" login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Tag and push the image
        if: github.server_url != 'https://github.com' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:$IMAGE_TAG_PROD"
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:$IMAGE_TAG_SHA"
          docker --config "$REGISTRY_CONFIG" push "$IMAGE_NAME:$IMAGE_TAG_SHA"
          docker --config "$REGISTRY_CONFIG" push "$IMAGE_NAME:$IMAGE_TAG_PROD"

      - name: Remove registry credentials
        if: always() && github.server_url != 'https://github.com'
        run: |
          if [ -n "${REGISTRY_CONFIG:-}" ]; then
            rm -f "$REGISTRY_CONFIG/config.json"
            rmdir "$REGISTRY_CONFIG"
          fi
